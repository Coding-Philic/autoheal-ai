[tool.poetry]
name = "autoheal-ai"
version = "0.1.0"
description = "AutoHeal AI — Autonomous Self-Healing Software Engine. Install once, self-heal forever."
authors = ["AutoHeal AI Team"]
license = "MIT"
readme = "README.md"
packages = [{include = "autoheal", from = "src"}]
keywords = ["self-healing", "error-detection", "ai", "debugging", "automation", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.poetry.scripts]
autoheal = "autoheal.cli.app:main"

[tool.poetry.dependencies]
python = "^3.11"
typer = {version = "^0.12.0", extras = ["all"]}
rich = "^13.0.0"
litellm = "^1.40.0"
psutil = "^5.9.0"
gitpython = "^3.1.0"
tomli-w = "^1.0.0"
pydantic = "^2.0.0"
platformdirs = "^4.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
mypy = "^1.10.0"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
